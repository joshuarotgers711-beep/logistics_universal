route:
  group_by: ['alertname', 'service_name']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'dev-null'

receivers:
  - name: 'dev-null'
    # Add real integrations here (email, slack, webhook_configs, etc.)

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match_re:
      severity: 'warning|info'
    equal: ['alertname', 'service_name']

