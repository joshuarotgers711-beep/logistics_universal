name: Observability Gate

on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      enable_mtls:
        description: "Run optional mTLS validation"
        required: false
        default: "false"
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC

jobs:
  obs-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GW: http://localhost:8086
      PROM: http://localhost:9090
      PRICING: http://localhost:8083
      ALERTS_E2E: "false"
      ALERTS_STRICT: "true"
      DEMO_ALERTS_TOKEN: "ci-demo-token"
      ENABLE_MTLS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker compose build --no-cache

      - name: Resolve ENABLE_MTLS (dispatch/schedule)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ENABLE_MTLS=${{ inputs.enable_mtls }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ENABLE_MTLS=true" >> $GITHUB_ENV
          fi
          echo "ENABLE_MTLS resolved to: ${ENABLE_MTLS}"

      - name: Start stack
        run: |
          export DEMO_ALERTS="$ALERTS_E2E"
          export DEMO_ALERTS_TOKEN="${DEMO_ALERTS_TOKEN:-ci-demo-token}"
          export ENABLE_MTLS="${ENABLE_MTLS:-false}"
          docker compose up -d
          # Wait for Prometheus and Gateway to come up
          for i in $(seq 1 60); do
            if curl -fsS $PROM/-/ready >/dev/null 2>&1 && curl -fsS $GW/health >/dev/null 2>&1; then
              echo "Prometheus and Gateway ready"; break; fi; sleep 5; done

      - name: Verify Prometheus rules loaded
        run: |
          sleep 3
          curl -fsS $PROM/api/v1/rules | jq -r '.data.groups[].name' | tee /tmp/rule-groups.txt
          # Ensure both prod and test route SLO groups (if present) don't error
          curl -fsS $PROM/api/v1/rules | jq -r '.data.groups[] | select(.name=="route-slos" or .name=="route-slos-test" or .name=="business-kpi-drop") | .name' || true

      - name: Run observability smoke test
        run: bash ./scripts/obs_smoke.sh

      - name: Deep health check: pricing-svc
        run: |
          for i in $(seq 1 30); do
            resp=$(curl -fsS "$PRICING/healthz/deep" || true)
            echo "$resp" > /tmp/pricing_health.json || true
            if jq -e '.overall.status=="healthy"' /tmp/pricing_health.json >/dev/null 2>&1; then
              echo "pricing-svc deep health OK"; break; fi; sleep 2; done
          if ! jq -e '.overall.status=="healthy"' /tmp/pricing_health.json >/dev/null 2>&1; then
            echo "pricing-svc deep health check failed:"; cat /tmp/pricing_health.json; exit 1; fi

      - name: Structural checks via Prometheus query API
        run: |
          # Ensure core metrics exist (server reqs)
          curl -fsS "$PROM/api/v1/series?match[]=http_server_requests_total" | jq .status
          # New KPI metrics should now exist after smoke traffic
          for m in shipments_created_total labels_generated_total pricing_quotes_total; do
            resp=$(curl -fsS "$PROM/api/v1/series?match[]=$m")
            echo "$resp" | jq -e '.status=="success" and (.data | length) > 0' >/dev/null \
              || { echo "Expected series for $m but none found"; exit 1; }
          done

      - name: SLO sanity checks (error rate and P99 latency)
        run: |
          # Helper to run a PromQL instant query and echo the scalar value (or 0 on empty)
          q() { curl -fsG --data-urlencode "query=$1" "$PROM/api/v1/query" | jq -r 'if .data.result|length>0 then .data.result[0].value[1] else 0 end'; }
          # Error rate (%). Use clamp_min to avoid div-by-zero when idle
          ER_EXPR='100 * ( sum(rate(http_server_errors[5m])) / clamp_min(sum(rate(http_server_requests[5m])), 1e-9) )'
          ER=$(q "$ER_EXPR")
          echo "Error rate 5m = $ER%"
          # P99 latency (ms) from histogram buckets
          P99_EXPR='histogram_quantile(0.99, sum by (le) (rate(http_server_duration_bucket[5m])))'
          P99=$(q "$P99_EXPR")
          echo "P99 latency 5m = ${P99}ms"
          # Thresholds (safe baselines for CI): ER <= 50%, P99 <= 1500ms
          awk -v er="$ER" 'BEGIN{ if (er > 50.0) { print "Error rate too high: " er "%"; exit 1 } }'
          awk -v p99="$P99" 'BEGIN{ if (p99 > 1500.0) { print "P99 latency too high: " p99 "ms"; exit 1 } }'

      - name: KPI funnel sanity (conversion ratios)
        run: |
          # Wait for scrapes
          sleep 5
          ratio() { curl -fsG --data-urlencode "query=$1" "$PROM/api/v1/query" | jq -r 'if .data.result|length>0 then .data.result[0].value[1] else 0 end'; }
          LQ='(sum(rate(labels_generated_total[10m])))/(clamp_min(sum(rate(pricing_quotes_total[10m])),1e-9))'
          SL='(sum(rate(shipments_created_total[10m])))/(clamp_min(sum(rate(labels_generated_total[10m])),1e-9))'
          LQv=$(ratio "$LQ"); SLv=$(ratio "$SL")
          echo "Labels/Quotes ratio (10m) = $LQv"; echo "Shipments/Labels ratio (10m) = $SLv"
          # Baselines: require >0 to prove flow exercised by smoke
          awk -v v="$LQv" 'BEGIN{ if (v+0<=0) { print "Labels/Quotes ratio is 0"; exit 1 } }'
          awk -v v="$SLv" 'BEGIN{ if (v+0<=0) { print "Shipments/Labels ratio is 0"; exit 1 } }'

      - name: RabbitMQ exporter check
        run: |
          # Verify exporter is scraped and DLQ metrics are present (even if zero)
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS "$PROM/api/v1/series?match[]=rabbitmq_queue_messages_ready" | jq -e '.status=="success"' >/dev/null 2>&1; then ok=1; break; fi
            echo "waiting for rabbitmq exporter scrape..."; sleep 5;
          done
          [ "$ok" = "1" ] || { echo "rabbitmq exporter metrics not present"; exit 1; }

      - name: DLQ tool presence (--help)
        run: |
          docker compose run --rm --profile tools dlqctl --help >/dev/null || { echo "dlqctl not runnable"; exit 1; }

      - name: Schema contract check (shipment-svc)
        run: |
          val=$(docker compose exec -T shipment-svc /bin/sh -lc 'echo -n $SCHEMA_VERSION')
          echo "SCHEMA_VERSION=$val"
          [ -n "$val" ] || { echo "SCHEMA_VERSION not set"; exit 1; }



      - name: Node exporter check
        run: |
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS "$PROM/api/v1/series?match[]=node_cpu_seconds_total" | jq -e '.status=="success"' >/dev/null 2>&1; then ok=1; break; fi
            echo "waiting for node-exporter scrape..."; sleep 5;
          done
          [ "$ok" = "1" ] || { echo "node-exporter metrics not present"; exit 1; }

      - name: cAdvisor exporter check
        run: |
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS "$PROM/api/v1/series?match[]=container_cpu_usage_seconds_total" | jq -e '.status=="success"' >/dev/null 2>&1; then ok=1; break; fi
            echo "waiting for cadvisor scrape..."; sleep 5;
          done
          [ "$ok" = "1" ] || { echo "cadvisor metrics not present"; exit 1; }

      - name: Burn-rate rules presence
        run: |
          curl -fsS "$PROM/api/v1/rules" | jq -e '.data.groups[] | .rules[]? | select(.name=="RouteSLOErrorBudgetBurnWarning" or .name=="RouteSLOErrorBudgetBurnCritical" or .name=="RouteSLOLatencyBurnWarning" or .name=="KPIFunnelLabelsToQuotesBurnWarning" or .name=="KPIFunnelShipmentsToLabelsBurnWarning")' >/dev/null \
            || { echo "Expected burn-rate rules not found"; exit 1; }

      - name: Optional: exercise test-mode route alerts (2m window)
        if: ${{ env.ALERTS_E2E == 'true' }}
        run: |
          echo "-- Exercising test-mode route alerts via demo endpoints for >2 minutes --"
          end=$(( $(date +%s) + 130 ))
          errs=0
          slows=0
          while [ $(date +%s) -lt $end ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Demo-Token: $DEMO_ALERTS_TOKEN" "$GW/__demo/5xx?status=500&duration_s=130") || code=000
            [[ "$code" =~ ^5 ]] && errs=$((errs+1))
            curl -s -o /dev/null -H "X-Demo-Token: $DEMO_ALERTS_TOKEN" "$GW/__demo/slow?delay_ms=800&duration_s=130" || true
            slows=$((slows+1))
            sleep 2
          done
          echo "Generated $errs 5xx responses and $slows slow responses. Waiting 10s before checking alerts..."
          sleep 10
          curl -fsS "$PROM/api/v1/alerts" | jq '.' > /tmp/alerts.json
          if jq -e '.data.alerts[] | select(.labels.alertname=="RouteHighErrorRateTest" or .labels.alertname=="RouteHighLatencyP99Test")' /tmp/alerts.json >/dev/null; then
            echo "Test-mode route alerts are firing";
          else
            echo "Test-mode route alerts not firing";
            if [ "$ALERTS_STRICT" = "true" ]; then echo "Failing due to ALERTS_STRICT"; exit 1; fi
      - name: Optional: mTLS validation (full)
        if: ${{ env.ENABLE_MTLS == 'true' }}
        run: |
          echo "Running full mTLS validation (ENABLE_MTLS=${ENABLE_MTLS})"
          bash scripts/mtls_validation.sh

      - name: Upload mTLS artifacts
        if: ${{ env.ENABLE_MTLS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mtls-artifacts
          path: .artifacts/mtls/

      - name: Tear down
        if: always()
        run: |
          docker compose logs --no-color > compose-logs.txt || true
          docker compose down -v || true

      - name: Upload compose logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

