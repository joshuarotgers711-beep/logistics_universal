apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: gateway-api }
  template:
    metadata:
      labels: { app: gateway-api }
    spec:
      containers:
        - name: gateway-api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-api-secrets
                  key: jwtSecret
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10

