apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-svc
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: pricing-svc }
  template:
    metadata:
      labels: { app: pricing-svc }
    spec:
      containers:
        - name: pricing-svc
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
          readinessProbe:
            httpGet: { path: /ready, port: 8083 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8083 }
            initialDelaySeconds: 3
            periodSeconds: 10

