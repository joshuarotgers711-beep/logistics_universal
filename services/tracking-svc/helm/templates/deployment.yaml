apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-svc
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: tracking-svc }
  template:
    metadata:
      labels: { app: tracking-svc }
    spec:
      containers:
        - name: tracking-svc
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8085
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
          readinessProbe:
            httpGet: { path: /ready, port: 8085 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8085 }
            initialDelaySeconds: 3
            periodSeconds: 10
}
